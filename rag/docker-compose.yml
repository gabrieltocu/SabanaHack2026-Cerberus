# n8n del RAG de Juan. Solo escucha en 127.0.0.1 (el robot llega al cerebro por el tunel ssh, no a n8n).
# DeepSeek y los embeddings corren en Ollama del Mac (Metal): el contenedor los alcanza en host.docker.internal.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    container_name: juan-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_SECURE_COOKIE=false
    volumes:
      - ./n8n/datos:/home/node/.n8n
      - ./n8n:/importar:ro
